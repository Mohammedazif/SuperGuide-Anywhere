<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SuperGuide Anywhere settings</title>
    <style>
      body {
        max-width: 640px;
        margin: 0 auto;
        padding: 24px;
        font: 14px/1.6 system-ui, sans-serif;
        color: #1a1a2e;
      }
      h1 { font-size: 18px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid #e2e2ec; }
      button { padding: 4px 10px; border: 1px solid #c8c8d8; border-radius: 6px; background: #f4f4fa; cursor: pointer; font: inherit; }
      button.danger { border-color: #b33; color: #b33; background: #fff; }
      .empty { color: #666; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="options.js"></script>
  </body>
</html>
