<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SuperGuide Anywhere</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font: 13px/1.5 system-ui, sans-serif;
        color: #1a1a2e;
      }
      h1 { font-size: 14px; margin: 0 0 4px; }
      .origin { color: #555; word-break: break-all; margin-bottom: 12px; }
      .tier { font-weight: 600; margin-bottom: 12px; }
      button {
        display: block;
        width: 100%;
        margin-bottom: 8px;
        padding: 8px 10px;
        border: 1px solid #c8c8d8;
        border-radius: 6px;
        background: #f4f4fa;
        cursor: pointer;
        font: inherit;
        text-align: left;
      }
      button.primary { background: #2b3a67; color: #fff; border-color: #2b3a67; }
      button.danger { border-color: #b33; color: #b33; background: #fff; }
      .note { color: #666; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="popup.js"></script>
  </body>
</html>
