services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: superguide_anywhere
    ports:
      - "55433:5432"
    volumes:
      - ./tools/scripts/bootstrap-roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d superguide_anywhere"]
      interval: 2s
      timeout: 3s
      retries: 30
